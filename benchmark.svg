<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">16 KiB stream throughput</title>
  <desc id="desc">Throughput: SNOW-Vi 78.03 Gbps, SNOW-V 52.47 Gbps, AES-256-CTR 48.98 Gbps, and ChaCha20 11.21 Gbps.</desc>
  <rect width="960" height="540" fill="#ffffff"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#262626">
    <text x="480" y="34" text-anchor="middle" font-size="20">16 KiB stream throughput</text>
    <text x="480" y="58" text-anchor="middle" font-size="12" fill="#666666">AArch64 · Go 1.26.5</text>

    <g stroke="#b0b0b0" stroke-width="1" opacity="0.45">
      <line x1="112" y1="430" x2="912" y2="430"/>
      <line x1="112" y1="342.5" x2="912" y2="342.5"/>
      <line x1="112" y1="255" x2="912" y2="255"/>
      <line x1="112" y1="167.5" x2="912" y2="167.5"/>
      <line x1="112" y1="80" x2="912" y2="80"/>
    </g>

    <g font-size="11" fill="#555555" text-anchor="end">
      <text x="102" y="434">0</text>
      <text x="102" y="346.5">20</text>
      <text x="102" y="259">40</text>
      <text x="102" y="171.5">60</text>
      <text x="102" y="84">80</text>
    </g>

    <line x1="112" y1="80" x2="112" y2="430" stroke="#262626" stroke-width="1.2"/>
    <line x1="112" y1="430" x2="912" y2="430" stroke="#262626" stroke-width="1.2"/>
    <text x="27" y="255" text-anchor="middle" font-size="12" transform="rotate(-90 27 255)">Throughput (Gbps)</text>

    <rect x="160" y="88.6" width="120" height="341.4" fill="#1f77b4"/>
    <rect x="350" y="200.4" width="120" height="229.6" fill="#ff7f0e"/>
    <rect x="540" y="215.7" width="120" height="214.3" fill="#2ca02c"/>
    <rect x="730" y="381.0" width="120" height="49.0" fill="#d62728"/>

    <g font-size="12" font-weight="600" text-anchor="middle">
      <text x="220" y="78">78.03</text>
      <text x="410" y="190">52.47</text>
      <text x="600" y="205">48.98</text>
      <text x="790" y="370">11.21</text>
    </g>

    <g font-size="12" text-anchor="middle">
      <text x="220" y="454">SNOW-Vi</text>
      <text x="410" y="454">SNOW-V</text>
      <text x="600" y="454">AES-256-CTR</text>
      <text x="790" y="454">ChaCha20</text>
    </g>
  </g>
</svg>
